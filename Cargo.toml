[package]
name = "pyperfguard"
version = "0.1.1"
edition = "2021"
rust-version = "1.74"
description = "Make performance regressions measurable, explainable, reproducible, and enforceable."
license = "Apache-2.0"
repository = "https://github.com/Mullassery/PyPerfGuard"
readme = "README.md"
keywords = ["benchmark", "performance", "regression", "ci", "profiling"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "pyperfguard"
path = "src/main.rs"

[lib]
name = "pyperfguard"
path = "src/lib.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "wrap_help"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde-well-known"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
proptest = "1.4"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "thin"
