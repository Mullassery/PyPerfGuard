[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "pyperfguard"
version = "0.1.1"
description = "Native benchmark runner and performance regression guard"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "PyPerfGuard Contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Testing",
  "Topic :: System :: Benchmark",
]

[project.scripts]
pyperfguard = "pyperfguard:main"

[tool.maturin]
bindings = "bin"
module-name = "pyperfguard"
features = []
sources = []
manifest-path = "Cargo.toml"
skip-auditwheel = true
locked = false
